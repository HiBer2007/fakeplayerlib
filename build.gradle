plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'fakeplayerlib'
}

// === NeoForged Maven 镜像重定向 ===
// maven.neoforged.net 在本机经常连不上，改走 forgecdn 镜像。
repositories.each { repo ->
    def urlStr = repo.url.toString()
    if (urlStr.contains('://maven.neoforged.net')) {
        repo.url = uri(urlStr.replace('://maven.neoforged.net', '://neoforged.forgecdn.net'))
        println "Replaced ${urlStr} -> ${repo.url}"
    }
}

repositories {
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    mavenCentral()
    maven { url = uri('https://maven.parchmentmc.org/') }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client {
            client()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


// ---- 测试用：导出 runClient 的完整启动命令，供 fastlaunch.bat 直接启动（跳过 Gradle 开销）----
tasks.register('probeRunClient') {
    doLast {
        def t = tasks.getByName('runClient')
        println "PROBE_TYPE=" + t.class.name
        try { println "PROBE_MAIN=" + t.mainClass.get() } catch (Throwable e) { println "PROBE_MAIN_ERR=" + e.message }
        println "PROBE_EXE=" + t.executable
        println "PROBE_WORKDIR=" + t.workingDir
        println "PROBE_CPCOUNT=" + t.classpath.files.size()
        try { println "PROBE_ARGS=" + t.args } catch (Throwable e) { println "PROBE_ARGS_ERR=" + e.message }
        def jvm = t.allJvmArgs
        println "PROBE_JVMSIZE=" + jvm.size()
        println "PROBE_JVM=" + jvm.join(" ||| ")
    }
}
